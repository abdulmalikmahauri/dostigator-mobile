org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Проект лежит по латинскому пути (C:\Claude Project\dostigator-mobile)
# намеренно. Кириллица в пути ломает сборку: Gradle её блокирует, а при
# снятии проверки путь приезжает в тулчейн Flutter в битой кодировке
# и компиляция падает на чтении app.dill. Не переносить в каталог
# с русским названием.

# Проект живёт в папке с кириллицей («Достигатор»). AGP по умолчанию
# отказывается собирать из таких путей на Windows. Проверка отключена
# осознанно: сборка проверена целиком после переезда. Если AAPT2 начнёт
# падать с невнятными ошибками путей — собирать через ASCII-junction.
android.overridePathCheck=true
