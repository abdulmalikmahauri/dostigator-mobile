<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Достигатор</title>
  <meta name="description" content="Приложение резидентов экосистемы «Достигатор»: цели, еженедельный чек-ин, мастермайнды, события клуба.">

  <!-- Приложение закрытое: в поиске ему делать нечего -->
  <meta name="robots" content="noindex, nofollow">

  <meta name="theme-color" content="#040E08">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Не black-translucent: Flutter в браузере не знает про вырез iPhone,
       и содержимое уехало бы под часы -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Достигатор">

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Тот же файл, что возьмёт приложение: грузится один раз на двоих -->
  <link rel="preload" as="font" type="font/otf"
        href="assets/assets/fonts/stolzl_medium.otf" crossorigin>

  <style>
    :root {
      --bg: #040E08;
      --accent: #00FE7E;
      --text: #F0F7F2;
    }

    @font-face {
      font-family: 'Stolzl';
      src: url('assets/assets/fonts/stolzl_medium.otf') format('opentype');
      font-weight: 500;
      font-display: swap;
    }

    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Оптический центр выше геометрического — иначе блок кажется осевшим */
      padding-bottom: 8vh;
      background:
        radial-gradient(120% 70% at 50% 18%, #0A2115 0%, rgba(4,14,8,0) 62%),
        var(--bg);
      font-family: 'Stolzl', system-ui, -apple-system, sans-serif;
      transition: opacity .32s ease-out;
    }

    #boot.done { opacity: 0; pointer-events: none; }

    /* Знак не перерисован: оригинальный файл работает маской,
       заливка поднимается снизу вверх — в этом и смысл марки */
    .mark { position: relative; width: 88px; height: 88px; }

    .mark i {
      position: absolute;
      inset: 0;
      background: var(--accent);
      -webkit-mask: url('brand-mark.png') center / contain no-repeat;
              mask: url('brand-mark.png') center / contain no-repeat;
    }

    .mark .base { opacity: .14; }

    .mark .fill {
      clip-path: inset(100% 0 0 0);
      animation: rise 1.15s cubic-bezier(.16, 1, .3, 1) forwards,
                 breathe 2.6s 1.15s ease-in-out infinite;
    }

    @keyframes rise   { to { clip-path: inset(0 0 0 0); } }
    @keyframes breathe { 0%, 100% { opacity: 1 } 50% { opacity: .5 } }

    .wordmark {
      margin-top: 26px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: .18em;
      color: var(--text);
    }

    .status {
      margin-top: 14px;
      min-height: 18px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .04em;
      color: rgba(240, 247, 242, .45);
      text-align: center;
      max-width: 260px;
      line-height: 1.6;
    }

    .retry {
      margin-top: 18px;
      padding: 11px 24px;
      border: 1px solid rgba(0, 254, 126, .38);
      border-radius: 999px;
      background: rgba(0, 254, 126, .1);
      color: var(--accent);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background .18s ease-out, transform .18s ease-out;
    }

    .retry[hidden] { display: none; }
    .retry:hover { background: rgba(0, 254, 126, .18); }
    .retry:active { transform: scale(.97); }
    .retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      .mark .fill { animation: none; clip-path: inset(0 0 0 0); }
      #boot, .retry { transition: none; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">
      <i class="base"></i>
      <i class="fill"></i>
    </div>
    <div class="wordmark">ДОСТИГАТОР</div>
    <p class="status" id="boot-status">Загружаем приложение</p>
    <button class="retry" id="boot-retry" hidden>Повторить</button>
    <noscript>
      <p class="status">Для работы приложения нужен включённый JavaScript.</p>
    </noscript>
  </div>

  <script>
    (function () {
      var boot = document.getElementById('boot');
      var status = document.getElementById('boot-status');
      var retry = document.getElementById('boot-retry');
      var settled = false;

      retry.addEventListener('click', function () { location.reload(); });

      // Первый кадр приложения — единственный честный признак,
      // что грузить больше нечего
      window.addEventListener('flutter-first-frame', function () {
        settled = true;
        boot.classList.add('done');
        setTimeout(function () { boot.remove(); }, 360);
      });

      window.addEventListener('boot-failed', function () {
        settled = true;
        status.textContent = 'Не удалось загрузить приложение. Проверьте связь.';
        retry.hidden = false;
      });

      // Воркер нужен для напоминаний о чек-ине: без него браузер
      // не отдаст подписку. Регистрируем сами — Flutter этого
      // с версии 3.44 больше не делает.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function (e) {
            // Приватное окно или http — напоминания просто не заработают,
            // приложение от этого не страдает
            console.warn('Уведомления недоступны: ' + e);
          });
        });
      }

      // Долгая загрузка — не ошибка: предлагаем перезапуск, но не врём,
      // будто всё сломалось. На мобильном интернете первая загрузка
      // действительно занимает несколько секунд.
      setTimeout(function () {
        if (settled) return;
        status.textContent = 'Загружается дольше обычного';
        retry.hidden = false;
      }, 18000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async
          onerror="window.dispatchEvent(new Event('boot-failed'))"></script>
</body>
</html>
